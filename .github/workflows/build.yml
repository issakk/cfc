name: build

# Cloud builds only: this repo is never built locally (no SDK on the dev machine).
# Everything up to the APK artifact happens here.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCV_VERSION: 4.12.0
  OPENCV_SDK: ${{ github.workspace }}/opencv-android-sdk
  # the app module pins 29.x; the :opencv module has no ndkVersion, so AGP asks
  # for its own default (25.1.8937393 on AGP 8.2.2) -- pre-install it instead of
  # letting the build download ~600MB mid-run
  NDK_VERSION: 29.0.14206865
  LEGACY_NDK_VERSION: 25.1.8937393
  BUILD_TOOLS_VERSION: 35.0.1
  COMPILE_SDK: 34

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: checkout (submodules included)
        uses: actions/checkout@v4
        with:
          # app/src/main/assets is the cimbar-js-bits submodule; without it
          # app/build.gradle's preBuild check throws (missing index.html)
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: set up android sdk
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            ndk;${{ env.LEGACY_NDK_VERSION }}
            cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: cache opencv android sdk
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENCV_SDK }}
          key: opencv-android-sdk-${{ env.OPENCV_VERSION }}

      - name: download opencv android sdk
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fL --retry 3 -o opencv.zip \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip"
          unzip -q opencv.zip
          rm -f opencv.zip
          mv OpenCV-android-sdk "${OPENCV_SDK}"

      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: build debug apk
        run: |
          set -eux
          # gradle.properties ships the upstream author's local paths; override them
          # here instead of editing the file (local Android Studio users keep theirs)
          sed -i "s|^opencvsdk=.*|opencvsdk=${OPENCV_SDK}|" gradle.properties
          sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=${JAVA_HOME}|" gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: show build summary
        if: always()
        run: |
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;
          # no local device and no local SDK: this is how the package name, version
          # and permissions that shipped actually get verified
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          "$AAPT2" dump badging app/build/outputs/apk/debug/*.apk | head -20 || true

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: CameraFileCopy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
